    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /client/AppointmentScheduling.Web
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directories:
      - /server/AppointmentScheduling.Api
      - /server/AppointmentScheduling.Tests
    schedule:
      interval: weekly
