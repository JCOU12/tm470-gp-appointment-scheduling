name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  quality:
    name: Backend lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore AppointmentScheduling.sln --locked-mode

      - name: Check formatting and analyser rules
        run: >-
          dotnet format AppointmentScheduling.sln
          --verify-no-changes
          --no-restore
          --severity warn
          --exclude server/AppointmentScheduling.Api/Data/Migrations

      - name: Build with warnings treated as errors
        run: dotnet build AppointmentScheduling.sln --configuration Release --no-restore --warnaserror

      - name: Run tests and collect coverage
        run: >-
          dotnet test AppointmentScheduling.sln
          --configuration Release
          --no-build
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory artefacts/test-results
          --logger "trx;LogFileName=tests.trx"

      - name: Enforce 80% line coverage
        shell: pwsh
        run: ./eng/Assert-CodeCoverage.ps1 -CoverageDirectory artefacts/test-results -MinimumLineCoverage 80

      - name: Retain test and coverage reports
        if: ${{ always() && hashFiles('artefacts/test-results/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: artefacts/test-results
          if-no-files-found: error
          retention-days: 14

  frontend-quality:
    name: Frontend lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client/AppointmentScheduling.Web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: client/AppointmentScheduling.Web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check frontend lint rules
        run: npm run lint

      - name: Build production client
        run: npm run build

      - name: Run frontend tests and enforce coverage
        run: npm run test:coverage

      - name: Retain frontend coverage report
        if: ${{ always() && hashFiles('client/AppointmentScheduling.Web/coverage/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: client/AppointmentScheduling.Web/coverage
          if-no-files-found: error
          retention-days: 14

  end-to-end:
    name: End-to-end appointment journeys
    runs-on: ubuntu-latest
    needs:
      - quality
      - frontend-quality
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client/AppointmentScheduling.Web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: client/AppointmentScheduling.Web/package-lock.json

      - name: Restore locked backend dependencies
        run: dotnet restore ../../AppointmentScheduling.sln --locked-mode

      - name: Restore pinned .NET tools
        run: dotnet tool restore

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run end-to-end journeys
        run: npm run test:e2e

      - name: Retain Playwright report
        if: ${{ always() && hashFiles('client/AppointmentScheduling.Web/playwright-report/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/AppointmentScheduling.Web/playwright-report
            client/AppointmentScheduling.Web/test-results
          if-no-files-found: warn
          retention-days: 14
